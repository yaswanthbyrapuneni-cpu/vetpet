[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "madina-vet-pet-api"
version = "0.1.0"
description = "Backend API for Madina Vet Pet"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "email-validator>=2.2,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "pyjwt>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "razorpay>=1.4,<2.0",
  "reportlab>=4.2,<5.0",
  "twilio>=9.3,<10.0",
  "pydantic-settings>=2.7,<3.0",
  "setuptools<81",
  "sqlalchemy>=2.0,<3.0",
  "truststore>=0.9,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4.0"]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["app*"]
